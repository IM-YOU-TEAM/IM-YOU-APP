<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Lab test results: joint-angle error and activity F1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="899" height="379" rx="14" fill="#FFFFFF" stroke="#DCE5DC"/><text x="24.0" y="36.0" font-size="18" font-weight="700" fill="#3C3744" text-anchor="start">Held-out lab test · Camargo AB23, AB24, AB25</text><text x="24.0" y="58.0" font-size="13" font-weight="400" fill="#6B6573" text-anchor="start">1,910 windows from subjects never seen in training · two-sensor 60 Hz model</text><text x="24.0" y="96.0" font-size="14" font-weight="600" fill="#3C3744" text-anchor="start">Joint-angle error (degrees, lower is better)</text><text x="24.0" y="134.0" font-size="13" font-weight="600" fill="#3C3744" text-anchor="start">Hip</text><rect x="94" y="118" width="221.0" height="22" rx="6" fill="#269F86" fill-opacity="0.22"/><rect x="94" y="118" width="158.6" height="22" rx="6" fill="#269F86"/><text x="323.0" y="134.0" font-size="12" font-weight="400" fill="#3C3744" text-anchor="start">6.80° RMSE · 4.88° MAE</text><text x="24.0" y="196.0" font-size="13" font-weight="600" fill="#3C3744" text-anchor="start">Knee</text><rect x="94" y="180" width="207.3" height="22" rx="6" fill="#269F86" fill-opacity="0.22"/><rect x="94" y="180" width="145.6" height="22" rx="6" fill="#269F86"/><text x="309.4" y="196.0" font-size="12" font-weight="400" fill="#3C3744" text-anchor="start">6.38° RMSE · 4.48° MAE</text><text x="24.0" y="258.0" font-size="13" font-weight="600" fill="#3C3744" text-anchor="start">Ankle</text><rect x="94" y="242" width="181.0" height="22" rx="6" fill="#269F86" fill-opacity="0.22"/><rect x="94" y="242" width="131.6" height="22" rx="6" fill="#269F86"/><text x="283.0" y="258.0" font-size="12" font-weight="400" fill="#3C3744" text-anchor="start">5.57° RMSE · 4.05° MAE</text><rect x="24" y="302" width="12" height="12"